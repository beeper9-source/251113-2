<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평가 결과 조회</title>
    <link rel="stylesheet" href="results.css">
</head>
<body>
    <div class="container">
        <h1>평가 결과 조회</h1>
        
        <nav class="menu">
            <a href="index.html" class="menu-item">Peers 조회</a>
            <a href="evaluation.html" class="menu-item">평가 입력</a>
            <a href="results.html" class="menu-item active">평가 결과</a>
        </nav>

        <div id="loading" class="loading" style="display: none;">
            데이터를 불러오는 중...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="viewTabs" class="view-tabs" style="display: none;">
            <button class="tab-btn" data-view="list">평가 목록</button>
            <button class="tab-btn active" data-view="summary">이름별 누계</button>
            <button id="copyBtn" class="btn btn-copy" style="display: none;">
                <span id="copyBtnText">결과 복사</span>
            </button>
        </div>

        <div id="results" class="results" style="display: none;">
            <div id="evaluationsList" class="evaluations-list">
                <!-- 평가 결과들이 여기에 동적으로 추가됩니다 -->
            </div>
        </div>

        <div id="summaryResults" class="summary-results" style="display: none;">
            <div id="compareControls" class="compare-controls" style="display: none;">
                <button id="compareBtn" class="btn-compare">
                    📊 선택한 사람들의 추이 비교
                </button>
                <button id="selectAllBtn" class="btn-select-all">
                    전체 선택
                </button>
                <button id="deselectAllBtn" class="btn-deselect-all">
                    전체 해제
                </button>
            </div>
            <div id="summaryList" class="summary-list">
                <!-- 이름별 누계점수가 여기에 동적으로 추가됩니다 -->
            </div>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <p>총 <span id="totalCount">0</span>개의 평가가 있습니다.</p>
        </div>
    </div>

    <!-- 이미지 팝업 모달 -->
    <div id="imageModal" class="image-modal">
        <span class="modal-close">&times;</span>
        <img class="modal-image" id="modalImage" src="" alt="확대 이미지">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <!-- 차트 모달 -->
    <div id="chartModal" class="chart-modal">
        <div class="chart-modal-content">
            <span class="chart-modal-close">&times;</span>
            <h2 id="chartModalTitle">점수 추이</h2>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="results.js"></script>
</body>
</html>
